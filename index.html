<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АП-Диагност</title>
<meta name="description" content="Диагностика и план лечения агрессивного пародонтита у подростков и молодых людей. EMU University.">
<meta name="theme-color" content="#621951">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="АП-Диагност">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#621951; --accent:#833775; --mid:#7C356F; --hi:#962961;
  --line:#DED0DD; --light:#F6EEF4; --zebra:#FBF6FA; --ink:#2A1024; --muted:#7A5A70;
  --ok:#2E7D4F; --okbg:#E6F4EC; --warn:#B45309; --warnbg:#FEF3E2; --bad:#B42318; --badbg:#FDECEA;
  --bg:#FFFFFF; --card:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(120deg,var(--deep) 0%,var(--accent) 100%);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(98,25,81,.25)}
.top-row{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{margin:0;font-size:12.5px;color:#E9CFE2}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-actions button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.top-actions button:hover{background:rgba(255,255,255,.24)}
nav.steps{display:flex;gap:4px;max-width:1080px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:1 0 auto;background:transparent;border:0;color:#E9CFE2;padding:10px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
nav.steps button .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:13px}
nav.steps button.active{color:#fff;border-bottom-color:#fff}
nav.steps button.done .n{background:#fff;color:var(--deep)}
nav.steps button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
.patient-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--light);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.patient-bar .f{flex:1 1 180px}
h2.sec{font-size:22px;margin:6px 0 4px;color:var(--deep);font-weight:800}
p.lead{margin:0 0 16px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--deep);display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11.5px;font-weight:700;background:var(--light);color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.card .hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.f label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.f .u{color:var(--muted);font-weight:500}
.f input[type=number],.f input[type=text],.f input[type=date],.f select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px;outline:none}
.f input:focus,.f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(131,55,117,.15)}
.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.f.flag input{border-color:var(--warn)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.chk:hover{border-color:var(--accent)}
.chk input{width:20px;height:20px;accent-color:var(--deep);margin-top:1px;flex:none}
.chk.on{background:var(--light);border-color:var(--accent)}
.chk.danger.on{background:var(--badbg);border-color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14.5px;font-weight:500;background:#fff}
.seg input{display:none}
.seg label.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:15}
.actions .in{max-width:1080px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;cursor:pointer}
.btn.primary{background:linear-gradient(120deg,var(--deep),var(--accent));color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--deep)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.verdict{border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1.5px solid}
.verdict.ok{background:var(--okbg);border-color:#9FD3B4}
.verdict.warn{background:var(--warnbg);border-color:#F5C77E}
.verdict.bad{background:var(--badbg);border-color:#F2A8A0}
.verdict.brand{background:linear-gradient(120deg,var(--deep),var(--mid));color:#fff;border-color:var(--deep);position:relative;overflow:hidden}
.verdict.brand::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--hi);opacity:.35}
.verdict .k{font-size:13px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;opacity:.8}
.verdict .v{font-size:24px;font-weight:800;margin:4px 0 6px;position:relative;z-index:1}
.verdict p{margin:4px 0;position:relative;z-index:1}
.meter{height:12px;border-radius:99px;background:#EADCE7;overflow:hidden;display:flex;margin:10px 0 4px}
.meter i{display:block;height:100%}
.meter .j{background:#A86A9A}.meter .r{background:var(--deep)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.verdict.brand .legend{color:#E9CFE2}
.verdict.brand .meter{background:rgba(255,255,255,.25)}
.verdict.brand .meter .j{background:#E9CFE2}.verdict.brand .meter .r{background:#fff}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{background:var(--deep);color:#fff;text-align:left;padding:9px 10px;font-weight:600}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--zebra)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.j{background:#F3E6F0;color:var(--accent)}.pill.r{background:var(--deep);color:#fff}.pill.n{background:#EEE;color:#555}
.pill.okp{background:var(--okbg);color:var(--ok)}.pill.badp{background:var(--badbg);color:var(--bad)}
.tablewrap{overflow-x:auto}
.plan-stage{border-left:4px solid var(--accent);background:#fff;border-radius:0 var(--radius) var(--radius) 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.plan-stage h4{margin:0 0 2px;font-size:17px;color:var(--deep)}
.plan-stage .when{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.plan-stage ul{margin:6px 0 0;padding-left:20px}
.plan-stage li{margin:4px 0}
.note{font-size:13.5px;padding:8px 10px;border-radius:8px;margin-top:8px}
.note.warn{background:var(--warnbg);color:#7A3E06}
.note.info{background:var(--light);color:var(--deep)}
.note.src{background:#F7F7F7;color:#555}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.list .item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.list .item b{color:var(--deep)}
.list .item .meta{color:var(--muted);font-size:13.5px}
.list .item .sp{margin-left:auto;display:flex;gap:6px}
.list .item button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;color:var(--deep)}
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(42,16,36,.45)}
dialog .dh{background:var(--deep);color:#fff;padding:14px 16px;font-weight:700;display:flex;align-items:center}
dialog .dh button{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
dialog .db{padding:16px;max-height:70vh;overflow:auto}
.missing{font-size:13.5px;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:600px){
  .brand p{display:none}
  .top-actions button span{display:none}
  h2.sec{font-size:20px}
  .verdict .v{font-size:21px}
  .btn{flex:1 1 auto;padding:13px 14px}
}
@media print{
  header.top,.actions,.patient-bar input,.noprint{display:none!important}
  main{padding:0}
  .card,.plan-stage,.verdict{break-inside:avoid}
  .verdict.brand{color:#000;background:#fff;border:2px solid var(--deep)}
  .verdict.brand::after{display:none}
  body{font-size:12.5px}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none"><path d="M20 8c-7 0-12 6-12 14 0 7 3 11 5 17 2 7 2 17 7 17 4 0 4-9 6-14 1-3 2-4 6-4s5 1 6 4c2 5 2 14 6 14 5 0 5-10 7-17 2-6 5-10 5-17 0-8-5-14-12-14-5 0-8 3-12 3s-7-3-12-3z" fill="#fff"/></svg>
    </div>
    <div class="brand">
      <h1>АП-Диагност</h1>
      <p>Агрессивный пародонтит: диагностика и лечение · EMU University</p>
    </div>
    <div class="top-actions">
      <button id="btnPatients" title="Пациенты"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg> <span>Пациенты</span></button>
      <button id="btnNew" title="Новый пациент">+ <span>Новый</span></button>
      <button id="btnAlgo" title="Алгоритм"><span>Алгоритм</span><svg class="noprint" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-left:4px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
    </div>
  </div>
  <nav class="steps" id="steps">
    <button data-step="1"><span class="n">1</span>Быстрая проверка</button>
    <button data-step="2" disabled><span class="n">2</span>Расширенная диагностика</button>
    <button data-step="3" disabled><span class="n">3</span>Окончательный диагноз</button>
    <button data-step="4" disabled><span class="n">4</span>План лечения</button>
  </nav>
</header>

<main id="main"></main>

<div class="actions"><div class="in" id="actions"></div></div>

<dialog id="dlg"><div class="dh"><span id="dlgTitle"></span><button onclick="document.getElementById('dlg').close()" aria-label="Закрыть">×</button></div><div class="db" id="dlgBody"></div></dialog>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
